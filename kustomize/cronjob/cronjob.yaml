apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron
  labels:
    app.kubernetes.io/name: cron
spec:
  # Replaced by the overlay.
  schedule: "0 6 * * *"
  timeZone: Etc/UTC
  # Only start a job within 5 minutes of its scheduled time. Without this, a
  # missed run (controller restart, schedule edit) is back-filled whenever the
  # controller next reconciles, which can start a job many hours late.
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cron
            azure.workload.identity/use: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: server
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cron
              # Same image as the web Deployment; renamed by the app's deploy/base.
              image: electronionicplatform.azurecr.io/PLACEHOLDER_APP:latest
              # Replaced by the overlay with the Heroku Scheduler command.
              command: ["node", "lib/cron.js"]
              envFrom:
                - secretRef:
                    name: server-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: tmp
              emptyDir: {}
