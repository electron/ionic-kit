# Remote base for a single-container HTTP service on ionic.
# Use it from an app repo's deploy/base; see README.md in this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
