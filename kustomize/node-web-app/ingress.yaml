apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server
spec:
  ingressClassName: nginx
  tls:
    # Shared origin certificate, delivered per namespace by the ionic-app module.
    - secretName: origin-tls
  rules:
    # Replaced by the app's prod overlay.
    - host: PLACEHOLDER_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  name: http
