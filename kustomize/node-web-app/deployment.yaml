apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        # Lets the pod use its per-component Azure identity (the `server`
        # ServiceAccount is annotated by Terraform). Harmless if unused.
        azure.workload.identity/use: "true"
    spec:
      # Provisioned by infra's ionic-app module: one ServiceAccount per component.
      serviceAccountName: server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Renamed by the app's deploy/base `images:` entry; tag set by CI.
          image: electronionicplatform.azurecr.io/PLACEHOLDER_APP:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            # Delivered by the ionic-app ExternalSecret. Keys are the env var
            # names declared in the app's infra entry (components.server.secrets).
            - secretRef:
                name: server-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Scratch space for os.tmpdir() and friends, since the root
            # filesystem is read-only.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: tmp
          emptyDir: {}
