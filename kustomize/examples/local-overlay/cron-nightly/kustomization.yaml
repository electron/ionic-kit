apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../cronjob
nameSuffix: -nightly
patches:
  - target:
      kind: CronJob
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "0 6 * * *"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command
        value: ["node", "lib/nightly.js"]
